<!-- officials.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ref Ledger V2.0 Officials Entry</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
<link rel="stylesheet" href="/components/navbar.css?v=12">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #f4f6f9;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 20px;
}

.header {
    background-color: #1e293b;
    color: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.header h1 {
    margin-bottom: 10px;
}

.form-card {
    background-color: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 20px;
}

.row {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
}

.col,
.form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.button-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    color: white;
    padding: 11px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.btn-find {
    background: #2563eb;
}

.btn-find:hover {
    background: #1d4ed8;
}

.btn-add {
    background-color: #16a34a;
}

.btn-add:hover {
    background-color: #15803d;
}

.btn-save {
    background-color: #5f16a3;
}

.btn-save:hover {
    background-color: #291580;
}

.btn-clear {
    background-color: #dc2626;
}

.btn-clear:hover {
    background-color: #b91c1c;
}

.btn-delete {
    background: #ffff00;
    color: black;
}

.btn-delete:hover {
    background: #ffc000;
    color: black;
}

.btn-directory {
    background-color: #7c3aed;
    color: white;
}

.btn-directory:hover {
    background-color: #6d28d9;
}

.btn-import {
    background-color: #0f766e;
    color: white;
}

.btn-import:hover {
    background-color: #115e59;
}

.message-box {
    background-color: white;
    padding: 15px 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    font-weight: bold;
    min-height: 60px;
    margin-bottom: 20px;
}

.directory-note {
    margin-bottom: 15px;
    color: #475569;
    font-size: 14px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background-color: #2563eb;
    color: white;
    padding: 10px;
    text-align: left;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

tr:nth-child(even) {
    background-color: #f9fafb;
}

@media (max-width: 768px) {
    .row,
    .button-row {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div id="navbar-container"></div>

<div class="container">

    <div class="header">
        <h1>Ref Ledger V2.0 Officials Entry</h1>
        <p>Manage and track Officials information.</p>
    </div>

    <div class="form-card">
        <form id="officialsForm">

            <div class="row">
                <div class="form-group">
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" required>
                </div>

                <div class="form-group">
                    <label for="lastname">Last Name</label>
                    <input type="text" id="lastname" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>

                <div class="col">
                    <label for="address">Address</label>
                    <input type="text" id="address">
                </div>
            </div>

            <div class="button-row">
                <button
                    type="button"
                    id="getOfficialBtn"
                    class="btn btn-find">
                    <i class="fa-solid fa-magnifying-glass"></i>                    
                    Find
                </button>

                <button
                    type="submit"
                    class="btn btn-add">
                    <i class="fa-solid fa-plus"></i>     
                    Add               
                </button>

                <button
                    type="button"
                    id="updateOfficialBtn"
                    class="btn btn-save">
                    <i class="fa-solid fa-pen"></i>                   
                    Save
                </button>

                <button
                    type="button"
                    id="deleteOfficialBtn"
                    class="btn btn-delete">
                    <i class="fa-solid fa-trash"></i>                   
                    Delete
                </button>
                
                <button
                    type="button"
                    id="clearBtn"
                    class="btn btn-clear"> 
                    <i class="fa-solid fa-eraser"></i>                   
                    Clear
                </button>

                <button
                    type="button"
                    id="directoryBtn"
                    class="btn btn-directory">
                    <i class="fa-solid fa-address-book"></i>                   
                    Directory
                </button>

                <button
                    type="button"
                    id="importOfficialsBtn"
                    class="btn btn-import">            
                    <i class="fa-solid fa-file-import"></i>
                    Import
                </button>
            </div>

        </form>
    </div>

    <div class="message-box" id="message">
        Ready to enter officials.
    </div>

    <div
        class="form-card"
        id="directorySection"
        style="display: none;"
    >
        <h2>Officials Directory</h2>

        <p class="directory-note">
            Directory is filtered by First Name and/or Last Name when
            those fields are filled in. Leave both blank to show all
            officials.
        </p>

        <table id="officialsTable">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Address</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>
    </div>

</div>

<script src="/components/navbar.js?v=12"></script>

<script>
function clearOfficialForm() {
    document.getElementById("officialsForm").reset();
    document.getElementById("firstname").focus();
}

document
    .getElementById("importOfficialsBtn")
    .addEventListener("click", function () {
        window.location.href = "/importOfficials";
    });

document
    .getElementById("clearBtn")
    .addEventListener("click", function () {
        clearOfficialForm();

        document.getElementById("message").innerText =
            "Form cleared.";
    });

document
    .getElementById("officialsForm")
    .addEventListener("submit", async function (e) {
        e.preventDefault();

        const official = {
            firstName: document
                .getElementById("firstname")
                .value
                .trim(),

            lastName: document
                .getElementById("lastname")
                .value
                .trim(),

            phone: document
                .getElementById("phone")
                .value
                .trim(),

            email: document
                .getElementById("email")
                .value
                .trim(),

            address: document
                .getElementById("address")
                .value
                .trim()
        };

        document.getElementById("message").innerText = "Saving Official";
        try {
            const response = await fetch("/api/officials", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(official)
            });

            if (response.status === 401 || response.redirected) {
                window.location.href = "/login";
                return;
            }

            if (response.status === 403) {
                document.getElementById("message").innerText =
                    "Permission denied. Read-only users cannot add officials.";

                return;
            }

            const message = await response.text();

            document.getElementById("message").innerText =
                response.ok
                    ? message || "Official saved successfully."
                    : message || "Error saving official.";

            if (response.ok) {
                clearOfficialForm();
            }
        } catch (err) {
            document.getElementById("message").innerText =
                "Server unavailable.";
        }
    });

document
    .getElementById("updateOfficialBtn")
    .addEventListener("click", async function (e) {
        e.preventDefault();

        const official = {
            firstName: document
                .getElementById("firstname")
                .value
                .trim(),

            lastName: document
                .getElementById("lastname")
                .value
                .trim(),

            phone: document
                .getElementById("phone")
                .value
                .trim(),

            email: document
                .getElementById("email")
                .value
                .trim(),

            address: document
                .getElementById("address")
                .value
                .trim()
        };

        document.getElementById("message").innerText = "Updating Official";
        try {
            const response = await fetch("/api/officials-update", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(official)
            });

            if (response.status === 401 || response.redirected) {
                window.location.href = "/login";
                return;
            }

            if (response.status === 403) {
                document.getElementById("message").innerText =
                    "Permission denied. Read-only users cannot update officials.";

                return;
            }

            const message = await response.text();

            document.getElementById("message").innerText =
                response.ok
                    ? message || "Official updated successfully."
                    : message || "Error updating official.";
        } catch (err) {
            document.getElementById("message").innerText =
                "Server unavailable.";
        }
    });

document
    .getElementById("getOfficialBtn")
    .addEventListener("click", async function () {
        const firstName = document
            .getElementById("firstname")
            .value
            .trim();

        const lastName = document
            .getElementById("lastname")
            .value
            .trim();

        if (!firstName || !lastName) {
            document.getElementById("message").innerText =
                "Enter both First Name and Last Name first.";

            return;
        }

        document.getElementById("message").innerText = "Loading Official";
        try {
            const response = await fetch(
                `/api/officials/${encodeURIComponent(
                    firstName
                )}/${encodeURIComponent(
                    lastName
                )}?t=${Date.now()}`
            );

            if (!response.ok) {
                document.getElementById("message").innerText =
                    "Official not found.";

                return;
            }

            const official = await response.json();

            document.getElementById("firstname").value =
                official.FirstName || "";

            document.getElementById("lastname").value =
                official.LastName || "";

            document.getElementById("phone").value =
                official.Phone || "";

            document.getElementById("email").value =
                official.Email || "";

            document.getElementById("address").value =
                official.Address || "";

            document.getElementById("message").innerText =
                "Official loaded successfully.";
        } catch (err) {
            document.getElementById("message").innerText =
                "Server unavailable.";
        }
    });

document
    .getElementById("deleteOfficialBtn")
    .addEventListener("click", async function () {
        const firstName = document
            .getElementById("firstname")
            .value
            .trim();

        const lastName = document
            .getElementById("lastname")
            .value
            .trim();

        if (!firstName || !lastName) {
            document.getElementById("message").innerText =
                "Enter both First Name and Last Name first.";

            return;
        }

        document.getElementById("message").innerText = "Deleting Official";

        try {
            const response = await fetch(
                `/api/deleteOfficial/${encodeURIComponent(
                    firstName
                )}/${encodeURIComponent(lastName)}`,
                {
                    method: "DELETE"
                }
            );

            const message = await response.text();

            document.getElementById("message").innerText =
                response.ok
                    ? message || "Official deleted successfully."
                    : message || "Error deleting official.";

            if (response.ok) {
                clearOfficialForm();
            }
        } catch (err) {
            document.getElementById("message").innerText =
                "Server unavailable.";
        }
    });

document
    .getElementById("directoryBtn")
    .addEventListener("click", async function () {
        const firstName = document
            .getElementById("firstname")
            .value
            .trim();

        const lastName = document
            .getElementById("lastname")
            .value
            .trim();

        const params = new URLSearchParams();

        if (firstName !== "") {
            params.append("firstname", firstName);
        }

        if (lastName !== "") {
            params.append("lastname", lastName);
        }

        params.append("t", Date.now());
        document.getElementById("message").innerText = "Loading Directory";
        
        try {
            const response = await fetch(
                `/api/officialsDirectory?${params.toString()}`
            );

            if (!response.ok) {
                document.getElementById("message").innerText =
                    "Unable to load directory.";

                return;
            }

            const officials = await response.json();
            const tbody = document.querySelector(
                "#officialsTable tbody"
            );

            tbody.innerHTML = "";

            if (!officials || officials.length === 0) {
                document.getElementById(
                    "directorySection"
                ).style.display = "block";

                document.getElementById("message").innerText =
                    "No officials found for the selected filter.";

                return;
            }

            officials.forEach(function (official) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${official.FirstName || ""}</td>
                    <td>${official.LastName || ""}</td>
                    <td>${official.Phone || ""}</td>
                    <td>${official.Email || ""}</td>
                    <td>${official.Address || ""}</td>
                `;

                tbody.appendChild(row);
            });

            document.getElementById(
                "directorySection"
            ).style.display = "block";

            document.getElementById("message").innerText =
                `${officials.length} officials loaded.`;
        } catch (err) {
            document.getElementById("message").innerText =
                "Server unavailable.";
        }
    });
</script>

</body>
</html>
