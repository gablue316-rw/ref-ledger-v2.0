<script>

// Set this URL to your existing sport-role GET route if its name differs.
const OFFICIAL_ROLES_API = "/api/settings/official-roles";
let isUpdateMode = false;
let pageReady = false;
let rolesReady = false;
let officialsDirectory = [];
let officialsLoadError = "";
let roleFields = [];
let roleRequest = 0;
let roleAbortController = null;
let formRevision = 0;

function updateActionButtons() {
    document.getElementById("addGameBtn").disabled = !pageReady || !rolesReady || isUpdateMode;
    document.getElementById("updateGameBtn").disabled = !pageReady || !rolesReady || !isUpdateMode;
    document.getElementById("getGameBtn").disabled = !pageReady;
}

function setUpdateMode(isUpdate) {
    isUpdateMode = isUpdate;
    document.getElementById("gameId").readOnly = isUpdate;
    document.getElementById("association").disabled = isUpdate;
    updateActionButtons();
}

function roleHint(message, error = false) {
    const hint = document.getElementById("officialRolesHint");
    document.getElementById("officialRolesMessage").textContent = message;
    hint.classList.toggle("error", error);
}

function resetOfficialFields() {
    roleRequest++;
    if (roleAbortController) roleAbortController.abort();
    roleAbortController = null;
    rolesReady = false;
    roleFields = [];
    document.getElementById("officialFields").replaceChildren();
    roleHint("Choose a sport in Location & Sport. Its official fields will appear here automatically.");
    updateActionButtons();
}

function normalizeRole(role) {
    return {
        roleId: String(role.roleId ?? role.RoleId ?? ""),
        title: String(role.title ?? role.Title ?? ""),
        displayOrder: Number(role.displayOrder ?? role.DisplayOrder ?? 0),
        active: (role.active ?? role.Active) === true
    };
}

function normalizeAssignment(assignment) {
    const rawId = assignment.officialId ?? assignment.OfficialId ?? "";
    return {
        roleId: String(assignment.roleId ?? assignment.RoleId ?? ""),
        title: String(assignment.title ?? assignment.Title ?? ""),
        displayOrder: Number(assignment.displayOrder ?? assignment.DisplayOrder ?? 0),
        officialId: rawId === 0 || rawId === "0" || rawId === "Unassigned" ? "" : String(rawId),
        name: String(assignment.name ?? assignment.Name ?? "Unassigned")
    };
}

function savedGameAssignments(game, roles) {
    if (!game) return [];
    const key = value => String(value ?? "").trim().toLowerCase().replace(/[\s_-]+/g, "");
    const byId = new Map(roles.map(role => [role.roleId, role]));
    const byTitle = new Map(roles.map(role => [key(role.title), role]));
    const result = new Map();
    const rawAssignments = game.Officials ?? game.officials;
    const assignments = Array.isArray(rawAssignments) ? rawAssignments : [];
    const withoutRoles = [];
    for (const raw of assignments) {
        const assignment = normalizeAssignment(raw);
        assignment.title = String(raw.title ?? raw.Title ?? raw.role ?? raw.Role ?? "").trim();
        const role = byId.get(assignment.roleId) || (!assignment.roleId ? byTitle.get(key(assignment.title)) : null);
        if (role) {
            assignment.roleId = role.roleId;
            assignment.title = assignment.title || role.title;
            if (raw.displayOrder == null && raw.DisplayOrder == null) assignment.displayOrder = role.displayOrder;
        }
        if (!assignment.roleId || !assignment.title) {
            if (assignment.officialId || (assignment.name && assignment.name !== "Unassigned")) withoutRoles.push(assignment);
            continue;
        }
        // The new array is authoritative, including explicitly Unassigned entries.
        result.set(assignment.roleId, assignment);
    }
    // Some existing handlers return Officials: [] together with Referee/U1/U2/ECO.
    // Fill missing roles from named legacy fields instead of ignoring those values.
    const fields = new Map(Object.entries(game).map(([name, value]) => [key(name), value]));
    for (const role of roles) {
        if (result.has(role.roleId)) continue;
        const aliases = [key(role.title)];
        if (key(role.title) === "plateumpire") aliases.push("referee");
        const field = aliases.find(name => fields.has(name));
        if (!field) continue;
        const value = fields.get(field);
        if (value == null || value === "") continue;
        const assignment = typeof value === "object" ? normalizeAssignment(value) : {
            officialId: "", name: String(value).trim()
        };
        result.set(role.roleId, {
            ...assignment, roleId: role.roleId, title: role.title, displayOrder: role.displayOrder
        });
    }
    // Do not silently drop a legacy assignment whose sport has no corresponding role.
    for (const title of ["Referee", "U1", "U2", "ECO"]) {
        const value = fields.get(key(title));
        if (value == null || value === "" || value === "Unassigned") continue;
        const role = byTitle.get(key(title)) || (title === "Referee" ? byTitle.get("plateumpire") : null);
        if (!role && !assignments.length) throw new Error(`The saved ${title} assignment has no matching role for this sport. Review it before saving.`);
    }
    // A list of names without role metadata cannot safely be matched by array position.
    const matched = Array.from(result.values());
    const unresolved = withoutRoles.filter(assignment => !matched.some(saved =>
        assignment.officialId ? saved.officialId === assignment.officialId || saved.name === assignment.name : saved.name === assignment.name
    ));
    if (unresolved.length) throw new Error("The game API returned officials without roleId/title. Update the Find handler to return each assignment's role metadata.");
    return matched;
}

function appendOfficialOption(select, official, value) {
    const option = new Option(official.name, value);
    option.dataset.officialId = official.officialId;
    option.dataset.name = official.name;
    select.add(option);
    return option;
}

function renderOfficialFields(roles, savedAssignments) {
    const container = document.getElementById("officialFields");
    container.replaceChildren();
    roleFields = [];
    const definitions = new Map(roles.map(role => [role.roleId, role]));
    const saved = new Map(savedAssignments.map(assignment => [assignment.roleId, assignment]));
    const fields = roles.filter(role => role.active).map(role => ({ role, assignment: saved.get(role.roleId) }));
    // Keep inactive or deleted saved assignments visible and unchanged during edits.
    savedAssignments.forEach(assignment => {
        if (!definitions.get(assignment.roleId)?.active) {
            fields.push({
                role: { roleId: assignment.roleId, title: assignment.title, displayOrder: assignment.displayOrder, active: false },
                assignment, preserved: true
            });
        }
    });
    fields.sort((a, b) => (a.assignment?.displayOrder ?? a.role.displayOrder) - (b.assignment?.displayOrder ?? b.role.displayOrder));
    fields.forEach(({ role, assignment, preserved }, index) => {
        const group = document.createElement("div");
        group.className = "form-group";
        const label = document.createElement("label");
        const select = document.createElement("select");
        select.id = `official-role-${index}`;
        label.htmlFor = select.id;
        label.textContent = (assignment?.title || role.title) + (preserved ? " (saved role)" : "");
        appendOfficialOption(select, { officialId: "", name: "Unassigned" }, "");
        officialsDirectory.forEach((official, officialIndex) => {
            appendOfficialOption(select, official, official.officialId ? `id:${official.officialId}` : `name:${officialIndex}`);
        });
        if (assignment && (assignment.officialId || (assignment.name && assignment.name !== "Unassigned"))) {
            const match = Array.from(select.options).find(option =>
                assignment.officialId ? option.dataset.officialId === assignment.officialId : option.dataset.name.trim().toLowerCase() === assignment.name.trim().toLowerCase()
            );
            if (match) select.value = match.value;
            else {
                const option = appendOfficialOption(select, {
                    officialId: assignment.officialId, name: assignment.name || `Official ${assignment.officialId}`
                }, `saved:${index}`);
                select.value = option.value;
            }
        }
        select.disabled = Boolean(preserved);
        group.append(label, select);
        container.appendChild(group);
        roleFields.push({ role, assignment, select, preserved: Boolean(preserved) });
    });
}

async function loadSportOfficialRoles(sport, game = null) {
    const request = ++roleRequest;
    if (roleAbortController) roleAbortController.abort();
    const controller = new AbortController();
    roleAbortController = controller;
    rolesReady = false;
    roleFields = [];
    document.getElementById("officialFields").replaceChildren();
    updateActionButtons();
    if (!sport) { roleHint("Choose a sport in Location & Sport. Its official fields will appear here automatically."); return false; }
    roleHint(`Loading official roles for ${sport}...`);
    try {
        if (officialsLoadError) throw new Error(officialsLoadError);
        const url = new URL(OFFICIAL_ROLES_API, window.location.origin);
        url.searchParams.set("sport", sport);
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`Unable to load official roles for ${sport} (${response.status}).`);
        const data = await response.json();
        if (request !== roleRequest) return false;
        const rawRoles = Array.isArray(data) ? data : data.roles ?? data.Roles;
        if (!Array.isArray(rawRoles)) throw new Error("The official roles response must contain a roles array.");
        const roles = rawRoles.map(normalizeRole).sort((a, b) => a.displayOrder - b.displayOrder);
        const ids = new Set();
        roles.forEach(role => {
            if (!role.roleId || !role.title || ids.has(role.roleId)) throw new Error("Official role definitions contain missing or duplicate identifiers.");
            ids.add(role.roleId);
        });
        const assignments = savedGameAssignments(game, roles);
        // Old report responses that lack role metadata are not safe to save as assignments.
        if (assignments.some(assignment => !assignment.roleId || !assignment.title)) {
            throw new Error("This game's officials response needs roleId and title for each assignment.");
        }
        renderOfficialFields(roles, assignments);
        if (!roleFields.length) {
            roleHint(`No active official roles are configured for ${sport}. Add roles in Settings first.`, true);
            return false;
        }
        rolesReady = true;
        roleHint(`${sport}: ${roleFields.length} official roles.`);
        updateActionButtons();
        return true;
    } catch (err) {
        if (request !== roleRequest || err.name === "AbortError") return false;
        roleHint(err.message || "Unable to load official roles.", true);
        return false;
    }
}

function collectOfficialAssignments() {
    if (!rolesReady || !document.getElementById("sport").value) throw new Error("Select a sport and wait for its official roles to load.");
    return roleFields.map(({ role, assignment, select, preserved }) => {
        if (preserved) return { ...assignment };
        const option = select.selectedOptions[0];
        return {
            roleId: role.roleId,
            title: assignment?.title || role.title,
            displayOrder: assignment?.displayOrder ?? role.displayOrder,
            officialId: option?.dataset.officialId || "",
            name: option?.dataset.name || "Unassigned"
        };
    });
}

function ensureSelectedValue(id, value) {
    const select = document.getElementById(id);
    const text = String(value ?? "");
    if (text && !Array.from(select.options).some(option => option.value === text)) select.add(new Option(text, text));
    select.value = text;
}

document.getElementById("sport").addEventListener("change", async function () {
    formRevision++;
    await loadSportOfficialRoles(this.value);
});

document
    .getElementById("importGamesBtn")
    .addEventListener("click", function () {
        window.location.href = "/importGames";
    });


async function loadAssignors() {
       try {
        const response = await fetch("/api/loadAssignors");

        if (!response.ok) {
            throw new Error("Failed to load assignors");
        }

        const assignors = await response.json();
        console.log(assignors);

        const dropdowns = [
            "assignor"
        ];

        dropdowns.forEach(id => {
            const select = document.getElementById(id);

            // Keep the first option
            select.innerHTML =
                '<option value="Unassigned">Unassigned</option>';
            select.value = "Unassigned";

            assignors.forEach(assignor => {
               const option = document.createElement("option");
               option.value = assignor.name;
               option.textContent = assignor.name;
               select.appendChild(option);
            });
        });

    } catch (err) {
        console.error("Error loading assignors:", err);
    }
}

async function loadOfficials() {
    try {
        const response = await fetch("/api/loadOfficials");
        if (!response.ok) throw new Error("Unable to load the officials directory. Reload the page to retry.");
        const data = await response.json();
        const officials = Array.isArray(data) ? data : data.officials ?? data.Officials;
        if (!Array.isArray(officials)) throw new Error("The officials directory response must contain an array.");
        officialsDirectory = officials.map(official => {
            const rawId = official.officialId ?? official.OfficialId ?? official.id ?? official.Id ?? "";
            return {
                officialId: rawId === 0 || rawId === "0" ? "" : String(rawId),
                name: typeof official === "string" ? official : String(official.name ?? official.Name ?? `${official.firstName ?? official.FirstName ?? ""} ${official.lastName ?? official.LastName ?? ""}`).trim()
            };
        }).filter(official => official.name && official.name !== "Unassigned");
        officialsLoadError = "";
    } catch (err) {
        officialsLoadError = err.message;
        console.error("Error loading officials:", err);
    }
}

function getStatusTypeName(statusType) {
    if (typeof statusType === "string") {
        return statusType.trim();
    }

    return String(
        statusType.statusType ??
        statusType.StatusType ??
        statusType.name ??
        statusType.Name ??
        statusType.status ??
        statusType.Status ??
        ""
    ).trim();
}

async function loadStatusTypes() {
    const statusSelect = document.getElementById("status");

    try {
        const response = await fetch("/api/loadStatusTypes");

        if (!response.ok) {
            const text = await response.text();
            throw new Error(
                `Unable to load status types: ${response.status} ${text}`
            );
        }

        const responseData = await response.json();
        const statusTypes = Array.isArray(responseData)
            ? responseData
            : responseData.statusTypes ?? responseData.statuses ?? [];

        const statuses = statusTypes
            .map(getStatusTypeName)
            .filter((status, index, values) =>
                status && values.indexOf(status) === index
            );

        statusSelect.innerHTML =
            '<option value="">Select Status</option>';

        statuses.forEach(status => {
            statusSelect.add(new Option(status, status));
        });

        if (statuses.includes("Pending")) {
            statusSelect.value = "Pending";
        }

        if (statuses.length === 0) {
            statusSelect.innerHTML =
                '<option value="">No statuses found</option>';
        }
    } catch (err) {
        console.error("Error loading status types:", err);
        statusSelect.innerHTML =
            '<option value="">Unable to load statuses</option>';
    }
}

document.addEventListener("DOMContentLoaded", async function() {

    await Promise.all([

        loadOfficials(),

        loadAssignors()
    ]);

function toInputDate(dateStr) {
    const d = new Date(dateStr);
    return d.toISOString().split("T")[0];
}

function toInputTime(timeStr) {

    if (!timeStr) return "";

    const [time, modifier] = timeStr.split(" ");
    let [hours, minutes] = time.split(":");

    hours = parseInt(hours, 10);

    if (modifier === "PM" && hours !== 12) {
        hours += 12;
    }
    if (modifier === "AM" && hours === 12) {
        hours = 0;
    }

    return `${String(hours).padStart(2, "0")}:${minutes}`;
}


document.getElementById("deleteBtn").addEventListener("click", async function () {

    const gameId = document.getElementById("gameId").value;

    if (!gameId) {

            "Enter a Game ID first.";
        return;
    }

    if (!association) {
        document.getElementById("message").innerText =
            "Enter an Association first.";
        return;
    }

    try {
        const response = await fetch(`/api/deleteGame/${association}/${gameId}`, {
            method: "DELETE"
        });

        const message = await response.text();

        document.getElementById("message").innerText =
            response.ok
                ? message || "Game deleted successfully."
                : message || "Error deleting game.";

        // Reload the navbar count after a successful delete.
        if (response.ok && typeof loadPendingGames === "function") {
            await loadPendingGames();
}

    } catch(err) {
        document.getElementById("message").innerText = "Server unavailable.";
    }
});

document.getElementById("getGameBtn").addEventListener("click", async function () {

    const gameId = document.getElementById("gameId").value;
    const association = document.getElementById("association").value;

    if (!gameId) {
        document.getElementById("message").innerText =
            "Enter a Game ID first.";
        return;
    }

    if (!association) {
        document.getElementById("message").innerText =
            "Enter an Association first.";
        return;
    }
    const revision = ++formRevision;
    try {

        const response = await fetch(`/api/game/${association}/${gameId}`);

        if (revision !== formRevision) return;
        if (!response.ok) {
            document.getElementById("message").innerText =
                "Game not found.";
            return;
        }

        const game = await response.json();
        console.log(
            "Find officials:",
            JSON.stringify(game.Officials ?? game.officials, null, 2)
        );        
       
        if (revision !== formRevision) return;

        console.log("Returned game:", game);

        document.getElementById("association").value = game.Association;
        document.getElementById("gameId").value = game.GameId;
        document.getElementById("date").value = toInputDate(game.Date);
        document.getElementById("time").value = toInputTime(game.Time);
        document.getElementById("site").value = game.Site;
        document.getElementById("field").value = game.Field;
        ensureSelectedValue("sport", game.Sport);
        document.getElementById("level").value = game.Level;
        document.getElementById("home").value = game.Home ?? "";
        document.getElementById("visitor").value = game.Visitor ?? "";

        document.getElementById("numOfGames").value = game.NumOfGames;
        document.getElementById("gameFee").value = game.GameFee;
        document.getElementById("travelPay").value = game.TravelPay;
        document.getElementById("assignorFee").value = game.AssignorFee;
        document.getElementById("deductions").value = game.Deductions;

        document.getElementById("status").value = game.Status;
        document.getElementById("assignor").value = game.Assignor;

        setUpdateMode(true);
        const loaded = await loadSportOfficialRoles(game.Sport, game);
        if (revision !== formRevision) return;
        if (!loaded) {
            document.getElementById("message").innerText = "Game loaded, but its official roles could not be loaded. Saving is disabled.";
            return;
        }     

        document.getElementById("message").innerText =
            "Game loaded successfully.";  

    } catch (err) {
        if (revision !== formRevision) return;
        document.getElementById("message").innerText =
            "Server unavailable.";
    }
});

document.getElementById("updateGameBtn").addEventListener("click", async function(e) {
    e.preventDefault();

    let assignments;

    catch (err) { document.getElementById("message").innerText = err.message; return; }
    const game = {
        association: document.getElementById("association").value,
        gameId: parseInt(document.getElementById("gameId").value),
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        site: document.getElementById("site").value,
        field: document.getElementById("field").value,

        game.assignorFee = 0;
        game.deductions = 0;

        document.getElementById("message").innerText =

    }

    try {
        const response = await fetch("/api/game-update", {
            method: "POST",
            headers: {

        });

        const message = await response.text();

        if (!response.ok) {
            document.getElementById("message").innerText =

            return;

        document.getElementById("message").innerText =

        // Reload the navbar count after a successful save.

            await loadPendingGames();
        }

    } catch (err) {
        console.error("Unable to save game:", err);

        document.getElementById("message").innerText =
            "Server unavailable.";
    }
});
