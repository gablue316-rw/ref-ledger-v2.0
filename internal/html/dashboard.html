<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ref Ledger V2.0 Game Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/components/navbar.css?v=12">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #f4f6f9;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 20px;
}

.header {
    background-color: #1e293b;
    color: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.header h1 {
    margin-bottom: 10px;
}

.filters,
.bulk-update {
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: end;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.filter-group {
    display: flex;
    flex-direction: column;
}

.filter-group label {
    margin-bottom: 5px;
    font-weight: bold;
}

.filter-group input,
.filter-group select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    min-width: 180px;
}

.btn {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background-color: #1d4ed8;
}

.update-btn {
    background-color: #15803d;
}

.update-btn:hover {
    background-color: #166534;
}

.games-count {
    margin-bottom: 10px;
    color: #475569;
    font-size: 16px;
    font-weight: bold;
}

.games-table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.games-table th {
    background-color: #0f172a;
    color: white;
    text-align: left;
    padding: 14px;
}

.games-table td {
    padding: 14px;
    border-bottom: 1px solid #eee;
}

.games-table tr:hover {
    background-color: #f8fafc;
}

.dashboard-message {
    margin-bottom: 15px;
    padding: 15px;
    border-radius: 8px;
    font-weight: bold;
    display: none;
}

.dashboard-message.info {
    background: #e0f2fe;
    color: #075985;
    border: 1px solid #7dd3fc;
}

.dashboard-message.error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
}

.status {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
}

.pending {
    background-color: #dbeafe;
    color: #1d4ed8;
}

.completed {
    background-color: #dcfce7;
    color: #15803d;
}

.paid {
    background-color: #fee2e2;
    color: #b91c1c;
}

.cancelled {
    background-color: #f3f4f6;
    color: #374151;
}

.bulk-controls {
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.official-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    background-color: rgba(0, 0, 0, 0.55);
}

.official-modal-content {
    position: relative;
    width: 90%;
    max-width: 400px;
    padding: 24px;
    border-radius: 8px;
    background-color: white;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}

.official-modal-content h2 {
    margin-top: 0;
    color: #082b4f;
}

.official-modal-close {
    position: absolute;
    top: 8px;
    right: 12px;
    border: none;
    background: none;
    font-size: 28px;
    cursor: pointer;
}

@media (max-width: 768px) {
    .filters,
    .bulk-update {
        flex-direction: column;
        align-items: stretch;
    }

    .filter-group input,
    .filter-group select {
        width: 100%;
    }

    .games-table {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div id="navbar-container"></div>

<div class="container">

    <div class="header">
        <h1>Ref Ledger V2.0 Game Dashboard</h1>
        <p>View and manage your game schedule</p>
    </div>
    
    <div class="filters">

        <div class="filter-group">
            <label for="gameId">Game ID</label>
            <input type="text" id="gameId" placeholder="Enter Game ID">
        </div>

        <div class="filter-group">
            <label for="status">Status</label>
            <select id="status">
                <option value="">All</option>
                <option value="Completed">Completed</option>
                <option value="Pending">Pending</option>
                <option value="Paid">Paid</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="begindate">Begin Date</label>
            <input
                type="text"
                id="begindate"
                placeholder="m/d/yyyy, today, this week">
        </div>

        <div class="filter-group">
            <label for="enddate">End Date</label>
            <input type="text" id="enddate" placeholder="m/d/yyyy">
        </div>

        <div class="filter-group">
            <label for="association">Association</label>
            <select id="association">
                <option value="">Select Association</option>
            </select>
        </div>        

        <div class="filter-group">
            <label for="sport">Sport</label>
            <select id="sport">
                <option value="">All</option>
                <option value="Basketball">Basketball</option>
                <option value="Softball">Softball</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="official">Official</label>
            <select id="official">
                <option value="">Select Official</option>
            </select>
        </div>    
        
        <div class="filter-group">
            <label for="site">Site</label>
            <select id="site">
                <option value="">Select Site</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="level">Level</label>
            <select id="level">
                <option value="">All</option>
                <option value="SP">Slow Pitch</option>
                <option value="PW">Pee Wee</option>
                <option value="Minor">Minor</option>
                <option value="Major">Major</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior</option>
                <option value="9th Grade">9th Grade</option>
                <option value="JV">Junior Varsity</option>
                <option value="Varsity">Varsity</option>
            </select>
        </div>

        <button class="btn" onclick="loadGames()">Search</button>
        <button class="btn" onclick="clearFilters()">Clear</button>

    </div>

    <div class="bulk-update">
        <div class="filter-group">
            <label for="bulkStatus">
                Update Selected Games To
            </label>

            <select id="bulkStatus">
                <option value="">Select Status</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
                <option value="Paid">Paid</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>
        
        <div class="bulk-controls">
            <label>
                <input type="checkbox" id="selectAll">
                <strong>Select All</strong>
            </label>
        </div>
        
        <button
            class="btn update-btn"
            onclick="updateSelectedStatus()">
            Update Status
        </button>
    </div>

    <div
        id="dashboardMessage"
        class="dashboard-message"
        role="status"
        aria-live="polite"
        style="display:none;">
    </div>

    <div
        id="gamesCount"
        class="games-count"
        aria-live="polite">
        0 games displayed
    </div>

    <table class="games-table">
        <thead>
            <tr>
                <th>Select</th>
                <th>Game ID</th>
                <th>Date</th>
                <th>Time</th>
                <th>Sport</th>
                <th>Site</th>
                <th>Field</th>
                <th>Num of Games</th>
                <th>Level</th>
                <th>Game Fee</th>
                <th>Assoc</th>
                <th>Status</th>
                <th>Officials</th>
            </tr>
        </thead>

        <tbody id="gamesBody">
        </tbody>
    </table>

</div>

<script src="/components/navbar.js?v=12"></script>

<script>
function getStatusClass(status) {
    if (status === "Completed") {
        return "completed";
    }

    if (status === "Pending") {
        return "pending";
    }

    if (status === "Paid") {
        return "paid";
    }

    if (status === "Cancelled") {
        return "cancelled";
    }

    return "pending";
}

function showMessage(message, type = "info") {
    const div = document.getElementById("dashboardMessage");

    div.className = `dashboard-message ${type}`;
    div.textContent = message;
    div.style.display = "block";
}

function hideMessage() {
    const div = document.getElementById("dashboardMessage");

    div.textContent = "";
    div.className = "dashboard-message";
    div.style.display = "none";
}

function updateGamesCount(count) {
    const gamesCount = document.getElementById("gamesCount");

    gamesCount.textContent =
        `${count} ${count === 1 ? "game" : "games"} displayed`;
}

function renderGames(
    games,
    emptyMessage = "No games were found matching your search criteria.",
    messageType = "info"
) {
    const tbody = document.getElementById("gamesBody");
    const displayedGameCount =
        Array.isArray(games) ? games.length : 0;

    tbody.innerHTML = "";

    updateGamesCount(displayedGameCount);

    document.getElementById("selectAll").checked = false;

    if (displayedGameCount === 0) {
        showMessage(emptyMessage, messageType);
        return;
    }

    hideMessage();

    games.forEach(game => {
        const row = document.createElement("tr");

        const officialsHtml = Array.isArray(game.Officials)
            ? game.Officials
                .map(official => `
                    <a
                        href="#"
                        class="official-link"
                        data-official-id="${official.OfficialId}">
                        ${official.Name}
                    </a>
                `)
                .join(", ")
            : "";

        row.innerHTML = `
            <td>
                <input
                    type="checkbox"
                    class="game-check"
                    value="${game.GameId}">
            </td>
            <td>${game.GameId || ""}</td>
            <td>${game.Date || ""}</td>
            <td>${game.Time || ""}</td>
            <td>${game.Sport || ""}</td>
            <td>${game.Site || ""}</td>
            <td>${game.Field || ""}</td>
            <td>${game.NumOfGames ?? ""}</td>
            <td>${game.Level || ""}</td>
            <td>${game.GameFee || ""}</td>
            <td>${game.Association || ""}</td>
            <td>
                <span
                    class="status ${getStatusClass(game.Status)}">
                    ${game.Status || ""}
                </span>
            </td>
            <td>${officialsHtml}</td>
        `;

        tbody.appendChild(row);
    });
}

document
    .getElementById("selectAll")
    .addEventListener("change", function () {
        const checked = this.checked;

        document.querySelectorAll(".game-check").forEach(cb => {
            cb.checked = checked;
        });
    });

async function loadOfficialDetails(officialId) {
    try {
        const response = await fetch(
            `/api/officials/${encodeURIComponent(officialId)}`
        );

        if (!response.ok) {
            const errorText = await response.text();

            throw new Error(
                `Unable to load official: ` +
                `${response.status} ${errorText}`
            );
        }

        const official = await response.json();

        document
            .getElementById("officialDetailsName")
            .textContent = official.Name || "Unknown";

        const phoneLink =
            document.getElementById("officialDetailsPhone");

        const phoneNumber = (official.Phone || "").trim();

        if (phoneNumber) {
            const smsNumber =
                phoneNumber.replace(/[^\d+]/g, "");

            phoneLink.textContent = phoneNumber;
            phoneLink.href = `sms:${smsNumber}`;

            phoneLink.setAttribute(
                "aria-label",
                `Send a text message to ` +
                `${official.Name || phoneNumber}`
            );
        } else {
            phoneLink.textContent = "Not available";
            phoneLink.removeAttribute("href");
            phoneLink.removeAttribute("aria-label");
        }

        document
            .getElementById("officialDetailsEmail")
            .textContent = official.Email || "Not available";

        document
            .getElementById("officialDetailsModal")
            .style.display = "flex";

    } catch (error) {
        console.error(
            "Error loading official details:",
            error
        );

        showMessage("Unable to load the official's contact information.", "error");
    }
}

function closeOfficialDetails() {
    document
        .getElementById("officialDetailsModal")
        .style.display = "none";
}

document.addEventListener("DOMContentLoaded", function () {
    document
        .getElementById("officialDetailsModal")
        .addEventListener("click", event => {
            if (event.target.id === "officialDetailsModal") {
                closeOfficialDetails();
            }
        });
});

document.addEventListener("click", event => {
    const link = event.target.closest(".official-link");

    if (!link) {
        return;
    }

    event.preventDefault();

    const officialId = link.dataset.officialId;

    loadOfficialDetails(officialId);
});

document.addEventListener("change", function (event) {
    if (!event.target.classList.contains("game-check")) {
        return;
    }

    const allCheckboxes =
        document.querySelectorAll(".game-check");

    const checkedCheckboxes =
        document.querySelectorAll(".game-check:checked");

    document.getElementById("selectAll").checked =
        allCheckboxes.length > 0 &&
        allCheckboxes.length === checkedCheckboxes.length;
});

async function loadAssociations() {
    try {
        const response =
            await fetch("/api/loadAssociations");

        if (!response.ok) {
            throw new Error(
                "Failed to load associations"
            );
        }

        const associations = await response.json();
        const select =
            document.getElementById("association");

        select.innerHTML =
            '<option value="">' +
            'Select Association' +
            '</option>';

        associations.forEach(assoc => {
            const option =
                document.createElement("option");

            option.value = assoc.id;
            option.textContent = assoc.id;

            select.appendChild(option);
        });

    } catch (err) {
        console.error(
            "Error loading associations:",
            err
        );
    }
}

async function loadPendingGamesTable() {
    const params = new URLSearchParams();

    params.append("status", "Pending");

    await fetchGames(
        params,
        "There are currently no games in Pending status."
    );
}

async function loadGames() {
    const gameId =
        document.getElementById("gameId").value;

    const status =
        document.getElementById("status").value;

    const begindate =
        document.getElementById("begindate").value;

    const enddate =
        document.getElementById("enddate").value;

    const site =
        document.getElementById("site").value;

    const association =
        document.getElementById("association").value;

    const level =
        document.getElementById("level").value;

    const sport =
        document.getElementById("sport").value;

    const official =
        document.getElementById("official").value;

    const params = new URLSearchParams();

    if (gameId) {
        params.append("gameId", gameId);
    }

    if (status) {
        params.append("status", status);
    }

    if (begindate) {
        params.append("begindate", begindate);
    }

    if (enddate) {
        params.append("enddate", enddate);
    }

    if (site) {
        params.append("site", site);
    }

    if (association) {
        params.append("association", association);
    }

    if (level) {
        params.append("level", level);
    }

    if (sport) {
        params.append("sport", sport);
    }

    if (official) {
        params.append("official", official);
    }

    await fetchGames(params);
}

async function fetchGames(
    params,
    emptyMessage =
        "No games were found matching your search criteria."
) {
    hideMessage();

    try {
        const response = await fetch(
            `/api/dashboard?${params.toString()}`
        );

        console.log("Status:", response.status);

        console.log(
            "Content-Type:",
            response.headers.get("content-type")
        );

        if (response.status === 404) {
            let message = emptyMessage;

            try {
                const errorData = await response.json();

                if (errorData.message) {
                    message = errorData.message;
                }
            } catch {
                // Use emptyMessage when response is not JSON.
            }

            renderGames([], message, "info");
            return;
        }

        if (!response.ok) {
            const text = await response.text();

            console.error("Server returned:", text);

            renderGames(
                [],
                "Unable to retrieve games from the server.",
                "error"
            );

            return;
        }

        const games = await response.json();

        console.log("Games:", games);

        renderGames(games, emptyMessage);

    } catch (err) {
        console.error("Failed to load games:", err);

        renderGames(
            [],
            "Unable to connect to the server.",
            "error"
        );
    }
}

async function loadSites() {
    try {
        const response = await fetch("/api/loadSites");

        if (!response.ok) {
            const text = await response.text();

            console.error(
                "loadSites failed:",
                response.status,
                text
            );

            showMessage(
                "loadSites failed: " +
                response.status +
                "\n" +
                text,
                "error"
            );

            return;
        }

        const sites = await response.json();
        const select = document.getElementById("site");

        select.innerHTML =
            '<option value="">Select Site</option>';

        sites.forEach(site => {
            const option =
                document.createElement("option");

            option.value = site.name;
            option.textContent = site.name;

            select.appendChild(option);
        });

    } catch (err) {
        console.error("Error loading sites:", err);
    }
}

async function loadOfficials() {
    try {
        const response =
            await fetch("/api/loadOfficials");

        if (!response.ok) {
            throw new Error(
                "Failed to load officials"
            );
        }

        const officials = await response.json();
        const select =
            document.getElementById("official");

        select.innerHTML =
            '<option value="">Select Official</option>';

        officials.forEach(official => {
            const option =
                document.createElement("option");

            option.value = official.name;
            option.textContent = official.name;

            select.appendChild(option);
        });

    } catch (err) {
        console.error(
            "Error loading officials:",
            err
        );
    }
}

document.addEventListener("DOMContentLoaded", function () {
    loadSites();
    loadAssociations();
    loadOfficials();
    loadPendingGamesTable();
});

async function updateSelectedStatus() {
    const newStatus =
        document.getElementById("bulkStatus").value;

    if (!newStatus) {
        showMessage("Please select a status.", "info");
        return;
    }

    const selectedGames = Array.from(
        document.querySelectorAll(
            ".game-check:checked"
        )
    ).map(cb => Number(cb.value));

    if (selectedGames.length === 0) {
        showMessage("Please select at least one game.", "info");
        return;
    }

    try {
        const response = await fetch(
            "/api/games/status",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    gameIds: selectedGames,
                    status: newStatus
                })
            }
        );

        if (!response.ok) {
            const text = await response.text();

            console.error("Update failed:", text);

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        showMessage("Game status updated successfully", "info");
        
        document.getElementById("bulkStatus").value =
            "";

        await loadPendingGamesTable();

        if (typeof loadPendingGames === "function") {
            await loadPendingGames();
        }

    } catch (err) {
        console.error(err);
        showMessage("Failed to update game status.", "error");
    }
}

function clearFilters() {
    document.getElementById("gameId").value = "";
    document.getElementById("status").value = "";
    document.getElementById("begindate").value = "";
    document.getElementById("enddate").value = "";
    document.getElementById("site").value = "";
    document.getElementById("association").value = "";
    document.getElementById("level").value = "";
    document.getElementById("sport").value = "";
    document.getElementById("official").value = "";

    loadPendingGamesTable();
}
</script>

<div id="officialDetailsModal" class="official-modal">
    <div class="official-modal-content">
        <button
            type="button"
            class="official-modal-close"
            onclick="closeOfficialDetails()">
            &times;
        </button>

        <h2 id="officialDetailsName">
            Official Details
        </h2>

        <p>
            <strong>Phone:</strong>
            <a id="officialDetailsPhone"></a>
        </p>

        <p>
            <strong>Email:</strong>
            <span id="officialDetailsEmail"></span>
        </p>

        <button
            type="button"
            class="btn"
            onclick="closeOfficialDetails()">
            Close
        </button>
    </div>
</div>

</body>
</html>
