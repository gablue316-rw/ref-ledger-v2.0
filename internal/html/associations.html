<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ref Ledger V2.0 Associations</title>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">    
    <link rel="stylesheet" href="/components/navbar.css?v=12">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
           background-color: #f4f6f9;
           color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .header {
            background-color: #1e293b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .form-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
        }

        textarea {
            resize: vertical;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            border: none;
            color: white;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-add {
            background-color: #16a34a;
        }

        .btn-add:hover {
            background-color: #15803d;
        }

        .btn-clear {
            background-color: #dc2626;
            color: white;
        }

        .btn-clear:hover {
            background-color: #b91c1c;
        }

        .btn-find{
            background:#2563eb;
        }

        .btn-find:hover{
            background:#1d4ed8;
        }        

        .btn-edit{
            background:#2616a3;
        }
        
        .btn-edit:hover{
            background:#251580;
        }
        
        .btn-delete {
            background-color: #ffff00;
            color: black;
        }

        .btn-delete:hover {
            background-color: #ffc000;
        }

        .btn-directory {
            background-color: #7c3aed;
        }

        .btn-directory:hover {
            background-color: #6d28d9;
        }

        .btn-import {
            background-color: #0f766e;
            color: white;
        }

        .btn-import:hover {
            background-color: #115e59;
        }

        .directory-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .select-all-label { display:flex; align-items:center; gap:8px; margin:0; cursor:pointer; }
        .select-all-label input, .association-check { width:auto; cursor:pointer; }
        .btn:disabled { cursor:not-allowed; opacity:.55; }
        .btn-delete-selected { background:#dc2626; }
        .btn-delete-selected:hover:not(:disabled) { background:#b91c1c; }

        .row-delete-btn {
            border: none;
            background: transparent;
            color: #dc2626;
            cursor: pointer;
            font-size: 17px;
            padding: 6px 9px;
            border-radius: 5px;
        }

        .row-delete-btn:hover {
            color: white;
            background: #dc2626;
        }

        .select-column,
        .delete-column {
            width: 70px;
            text-align: center !important;
        }

        .association-check {
            width: 17px;
            height: 17px;
            cursor: pointer;
        }

        .delete-modal { width:min(460px,calc(100% - 32px)); padding:0; border:none; border-radius:16px; box-shadow:0 24px 60px rgba(15,23,42,.3); overflow:hidden; }
        .delete-modal::backdrop { background:rgba(15,23,42,.65); backdrop-filter:blur(3px); }
        .delete-modal-content { background:white; }
        .delete-modal-header { display:flex; align-items:center; gap:14px; padding:22px 24px 16px; }
        .delete-modal-icon { display:grid; place-items:center; flex:0 0 48px; height:48px; border-radius:50%; background:#fee2e2; color:#dc2626; font-size:21px; }
        .delete-modal-header h2 { color:#1e293b; font-size:21px; margin-bottom:3px; }
        .delete-modal-header p { color:#64748b; font-size:14px; }
        .delete-modal-body { padding:4px 24px 22px; color:#475569; line-height:1.55; }
        .delete-modal-target { margin-top:14px; padding:12px 14px; border:1px solid #fecaca; border-radius:9px; background:#fff7f7; color:#991b1b; font-weight:bold; }
        .delete-modal-actions { display:flex; justify-content:flex-end; gap:10px; padding:16px 24px; border-top:1px solid #e2e8f0; background:#f8fafc; }
        .btn-modal-cancel { background:white; color:#334155; border:1px solid #cbd5e1; }
        .btn-modal-delete { background:#dc2626; }
 
        .message-box {
            background-color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-weight: bold;
            min-height: 60px;
            margin-bottom: 20px;
        }

.directory-note { margin-bottom:15px; color:#475569; font-size:14px; }

.directory-table {
    width: 100%;
    border-collapse: collapse;
}

.directory-table th {
    background: #2563eb;
    color: white;
    padding: 12px;
    text-align: left;
}

.directory-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
}

.directory-table tr:nth-child(even) {
    background: #f8fafc;
}

.directory-table tr:hover {
    background: #eef4ff;
}

.directory-table tbody tr {
    cursor: pointer;
}

        @media (max-width: 768px) {

            .row, .button-row, .directory-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
            .delete-modal-actions .btn { width:auto; }
        }

    </style>
</head>

<body>

<div id="navbar-container"></div>   

<div class="container">

    <div class="header">
        <h1>Ref Ledger V2.0 Associations</h1>
        <p>Manage your Associations</p>
    </div>


    <div class="form-card">

        <form id="associationForm">

            <div class="row">

                <div class="col">
                    <label for="assocId">Association ID</label>
                    <input
                        type="text" 
                        id="assocId" 
                        placeholder="Enter Association ID" required
                    >
                </div>

                <div class="col">
                    <label for="assocName">Association Name</label>
                    <input type="text" id="assocName" placeholder="Enter Association Name">
                </div>

                <div class="col">
                    <label for="contactName">Contact Name</label>
                    <input type="text" id="contactName" placeholder="Enter Contact Name">
                </div>

            </div>

            <div class="row">

                <div class="col">
                    <label for="contactNumber">Contact Number</label>
                    <input type="text" id="contactNumber" placeholder="Enter Contact Number">
                </div>
 
                <div class="col">
                    <label for="contactEmail">Contact Email</label>
                    <input type="email" id="contactEmail" placeholder="Enter Contact Email">
                </div>

                <div class="col">
                    <label for="assignors">Assignors</label>
                    <input type="text" id="assignors" placeholder="Enter Assignors (comma-separated)">
                </div>

            </div>

            <div class="button-row">

                <button
                    type="button"
                    id="getAssocBtn"
                    class="btn btn-find">
                    <i class="fa-solid fa-magnifying-glass"></i>                    
                    Find
                </button>
                 
                <button
                    type="submit"
                    class="btn btn-add">
                    <i class="fa-solid fa-plus"></i>     
                    Add               
                </button>          
                
                <button
                   type="button"
                   id="editBtn"
                   class="btn btn-edit">
                   <i class="fa-solid fa-pen"></i>                   
                   Save
                </button>                
                
                <button
                   type="button"
                   id="deleteBtn"
                   class="btn btn-delete">
                   <i class="fa-solid fa-trash"></i>                   
                   Delete
                </button>

                <button
                    type="button"
                    id="clearAssocBtn"
                    class="btn btn-clear">
                    <i class="fa-solid fa-eraser"></i>                    
                    Clear 
                </button>      

                <button
                   type="button"
                   id="directoryBtn"
                   class="btn btn-directory">
                   <i class="fa-solid fa-folder"></i>
                   Directory
                </button>

                <button 
                   type="button" 
                   id="importAssociationsBtn" 
                   class="btn btn-import"> 
                   <i class="fa-solid fa-file-import"></i>
                   Import
                </button>


            </div>

        </form>

    </div>

    <div class="message-box" id="message">
        Ready to enter Associations
    </div>

<div class="form-card" id="directorySection" style="display:none;">
    <h2>Association Directory</h2>
    <p class="directory-note">Manage associations individually or select multiple associations for deletion.</p>

    <div class="directory-actions">
        <label class="select-all-label" for="selectAllAssociations">
            <input type="checkbox" id="selectAllAssociations">
            Select All
        </label>

        <button type="button" id="deleteSelectedBtn" class="btn btn-delete-selected" disabled>
            <i class="fa-solid fa-trash"></i>
            Delete Selected
        </button>
    </div>

    <table id="associationsTable" class="directory-table">
        <thead>
            <tr>
                <th class="select-column">Select</th>
                <th>ID</th>
                <th>Association</th>
                <th>Contact</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Assignors</th>
                <th class="delete-column">Delete</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<dialog id="deleteConfirmationModal" class="delete-modal" aria-labelledby="deleteModalTitle" aria-describedby="deleteModalMessage">
    <div class="delete-modal-content">
        <div class="delete-modal-header">
            <div class="delete-modal-icon" aria-hidden="true"><i class="fa-solid fa-trash-can"></i></div>
            <div><h2 id="deleteModalTitle">Confirm deletion</h2><p>This action cannot be undone.</p></div>
        </div>
        <div class="delete-modal-body">
            <p id="deleteModalMessage"></p>
            <div id="deleteModalTarget" class="delete-modal-target"></div>
        </div>
        <div class="delete-modal-actions">
            <button type="button" id="cancelDeleteBtn" class="btn btn-modal-cancel">
                Cancel
            </button>
            <button type="button" id="confirmDeleteBtn" class="btn btn-modal-delete">
                <i class="fa-solid fa-trash-can"></i>
                Delete
            </button>
        </div>
    </div>
</dialog>
    
</div>

<script src="/components/navbar.js?v=12"></script>

<script>

function clearAssociationsForm() {
    document.getElementById("associationForm").reset();
}

const selectAllAssociations = document.getElementById("selectAllAssociations");
const deleteSelectedBtn = document.getElementById("deleteSelectedBtn");
const deleteConfirmationModal = document.getElementById("deleteConfirmationModal");

function confirmAssociationDeletion(message, target) {
    document.getElementById("deleteModalMessage").textContent = message;
    document.getElementById("deleteModalTarget").textContent = target;
    deleteConfirmationModal.showModal();
    return new Promise(function (resolve) {
        function finish(confirmed) {
            document.getElementById("confirmDeleteBtn").removeEventListener("click", confirmDeletion);
            document.getElementById("cancelDeleteBtn").removeEventListener("click", cancelDeletion);
            deleteConfirmationModal.removeEventListener("cancel", cancelWithEscape);
            deleteConfirmationModal.removeEventListener("click", cancelFromBackdrop);
            deleteConfirmationModal.close();
            resolve(confirmed);
        }
        function confirmDeletion() { finish(true); }
        function cancelDeletion() { finish(false); }
        function cancelWithEscape(event) { event.preventDefault(); finish(false); }
        function cancelFromBackdrop(event) { if (event.target === deleteConfirmationModal) finish(false); }
        document.getElementById("confirmDeleteBtn").addEventListener("click", confirmDeletion);
        document.getElementById("cancelDeleteBtn").addEventListener("click", cancelDeletion);
        deleteConfirmationModal.addEventListener("cancel", cancelWithEscape);
        deleteConfirmationModal.addEventListener("click", cancelFromBackdrop);
        document.getElementById("cancelDeleteBtn").focus();
    });
}

function updateAssociationSelection() {
    const checkboxes = Array.from(document.querySelectorAll(".association-check"));
    const selectedCount = checkboxes.filter(checkbox => checkbox.checked).length;
    selectAllAssociations.checked = checkboxes.length > 0 && selectedCount === checkboxes.length;
    selectAllAssociations.indeterminate = selectedCount > 0 && selectedCount < checkboxes.length;
    deleteSelectedBtn.disabled = selectedCount === 0;
}

async function deleteAssociation(assocId) {
    const response = await fetch(
        `/api/deleteAssociation/${encodeURIComponent(assocId)}`,
        { method: "DELETE" }
    );

    const message = await response.text();

    if (!response.ok) {
        throw new Error(message || `Unable to delete association ${assocId}.`);
    }

    return message;
}

document
    .getElementById("importAssociationsBtn")
    .addEventListener("click", function () {
        window.location.href = "/importAssociations";
    });


document.getElementById("clearAssocBtn").addEventListener("click", function () {
    document.getElementById("associationForm").reset();
    document.getElementById("message").innerText = "";
});


document.getElementById("getAssocBtn").addEventListener("click", async function () {

    const assocId = document.getElementById("assocId").value;
    
    if (!assocId) {
        document.getElementById("message").innerText =
            "Enter an Association ID first.";
        return;
    }

    try {

        const response = await fetch(`/api/association/${assocId}`);

        if (!response.ok) {
            document.getElementById("message").innerText =
                "Association not found.";
            return;
        }

        const association = await response.json();

        console.log("Returned association:", association);

        document.getElementById("assocId").value = association.Id || "";
        document.getElementById("assocName").value = association.Name || "";
        document.getElementById("contactName").value = association.Contact || "";
        document.getElementById("contactNumber").value = association.Phone || "";
        document.getElementById("contactEmail").value = association.Email || "";
        document.getElementById("assignors").value = association.Assignors || "";

        document.getElementById("message").innerText =
            "Association loaded successfully.";

    } catch (err) {
        document.getElementById("message").innerText =
            "Server unavailable.";
    }
});


document.getElementById("deleteBtn").addEventListener("click", async () => {

    const assocId = document.getElementById("assocId").value.trim();
    const assocName = document.getElementById("assocName").value.trim();

    if (!assocId) {
        document.getElementById("message").innerText =
            "Enter or load an Association ID before deleting.";
        return;
    }

    const description = assocName
        ? `\"${assocName}\" (${assocId})`
        : `association ${assocId}`;

    const confirmed = await confirmAssociationDeletion(
        "You are about to permanently delete this association.", description
    );
    if (!confirmed) return;
    try {
        const message = await deleteAssociation(assocId);
        document.getElementById("message").innerText = message || "Association deleted successfully.";
        clearAssociationsForm();
    } catch (err) { document.getElementById("message").innerText = err.message; }
});

document.getElementById("associationForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const association = {
       id: document.getElementById("assocId").value,
       name: document.getElementById("assocName").value,
       contact: document.getElementById("contactName").value,
       phone: document.getElementById("contactNumber").value,
       email: document.getElementById("contactEmail").value,
       assignors: document.getElementById("assignors").value
    };

    try {
        const response = await fetch("/api/associations", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(association)
        });

        const message = await response.text();

        document.getElementById("message").innerText =
            response.ok
                ? message || "Association saved successfully."
                : message || "Error saving association.";

        if (response.ok) {
           clearAssociationsForm();
        }

    } catch(err) {
        document.getElementById("message").innerText = "Server unavailable.";
    }
});

document
    .getElementById("editBtn")
    .addEventListener("click", async function (e) {
        e.preventDefault();

    const association = {
       id: document.getElementById("assocId").value,
       name: document.getElementById("assocName").value,
       contact: document.getElementById("contactName").value,
       phone: document.getElementById("contactNumber").value,
       email: document.getElementById("contactEmail").value,
       assignors: document.getElementById("assignors").value
    };

    try {
        const response = await fetch("/api/associations-update", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(association)
        });

        const message = await response.text();

        document.getElementById("message").innerText =
            response.ok
                ? message || "Association updated successfully."
                : message || "Error updating association.";

    } catch(err) {
        document.getElementById("message").innerText = "Server unavailable.";
    }
});


document.getElementById("directoryBtn").addEventListener("click", async function () {
    try {
        const response = await fetch(`/api/associationsDirectory?t=${Date.now()}`);

        if (!response.ok) {
            document.getElementById("message").innerText =
                "Unable to load association directory.";
            return;
        }

        const associations = await response.json();

        const tbody = document.querySelector("#associationsTable tbody");
        tbody.innerHTML = "";
        selectAllAssociations.checked = false;
        selectAllAssociations.indeterminate = false;
        deleteSelectedBtn.disabled = true;

        if (!associations || associations.length === 0) {
            document.getElementById("directorySection").style.display = "block";
            document.getElementById("message").innerText =
                "No associations found.";
            return;
        }

        associations.forEach(function (association) {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td class="select-column">
                    <input
                        type="checkbox"
                        class="association-check"
                        value="${association.Id || ""}"
                        aria-label="Select ${association.Name || association.Id || "association"}"
                    >
                </td>
                <td>${association.Id || ""}</td>
                <td>${association.Name || ""}</td>
                <td>${association.Contact || ""}</td>
                <td>${association.Phone || ""}</td>
                <td>${association.Email || ""}</td>
                <td>${association.Assignors || ""}</td>
                <td class="delete-column">
                    <button
                        type="button"
                        class="row-delete-btn"
                        title="Delete association"
                        aria-label="Delete ${association.Name || association.Id || "association"}"
                    >
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            `;

            row.querySelector(".association-check").addEventListener("change", updateAssociationSelection);

            row.addEventListener("click", function (event) {
                if (event.target.closest(".association-check, .row-delete-btn")) {
                    return;
                }

                document.getElementById("assocId").value = association.Id || "";
                document.getElementById("assocName").value = association.Name || "";
                document.getElementById("contactName").value = association.Contact || "";
                document.getElementById("contactNumber").value = association.Phone || "";
                document.getElementById("contactEmail").value = association.Email || "";
                document.getElementById("assignors").value = association.Assignors || "";

                document.getElementById("message").innerText =
                    "Association loaded.";
            });

            row.querySelector(".row-delete-btn").addEventListener("click", async function () {
                const description = association.Name
                    ? `\"${association.Name}\" (${association.Id})`
                    : `association ${association.Id}`;

                const confirmed = await confirmAssociationDeletion(
                    "You are about to permanently delete this association.", description
                );
                if (!confirmed) return;
                try {
                    const message = await deleteAssociation(association.Id);
                    row.remove();
                    updateAssociationSelection();
                    document.getElementById("message").innerText = message || "Association deleted successfully.";
                    if (!tbody.children.length) document.getElementById("message").innerText = "Association deleted successfully. No associations remain.";
                } catch (err) { document.getElementById("message").innerText = err.message; }
            });

            tbody.appendChild(row);
        });

        document.getElementById("directorySection").style.display = "block";

        document.getElementById("message").innerText =
            `${associations.length} associations loaded.`;

    } catch (err) {
        document.getElementById("message").innerText = "Server unavailable.";
    }
});

selectAllAssociations.addEventListener("change", function () {
    document.querySelectorAll(".association-check").forEach(function (checkbox) {
        checkbox.checked = selectAllAssociations.checked;
    });
    updateAssociationSelection();
});

deleteSelectedBtn.addEventListener("click", async function () {
    const selected = Array.from(
        document.querySelectorAll(".association-check:checked")
    );

    if (!selected.length) {
        document.getElementById("message").innerText =
            "Select at least one association to delete.";
        return;
    }

    const count = selected.length;
    const confirmed = await confirmAssociationDeletion(
        "You are about to permanently delete the selected associations.",
        `${count} selected association(s)`
    );
    if (!confirmed) return;
            const deletedIds = [];
            const errors = [];

            for (const checkbox of selected) {
                try {
                    await deleteAssociation(checkbox.value);
                    deletedIds.push(checkbox.value);
                    checkbox.closest("tr").remove();
                } catch (err) {
                    errors.push(`${checkbox.value}: ${err.message}`);
                }
            }

            const messageElement = document.getElementById("message");

            if (!errors.length) {
                messageElement.innerText =
                    `${deletedIds.length} association${deletedIds.length === 1 ? "" : "s"} deleted successfully.`;
            } else {
                messageElement.innerText =
                    `${deletedIds.length} deleted. ${errors.length} could not be deleted: ${errors.join(" | ")}`;
            }

            updateAssociationSelection();
});

</script>

</body>
</html>
