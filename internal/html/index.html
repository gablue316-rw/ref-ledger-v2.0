<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ref Ledger V2.0</title>

    <!-- Font Awesome used by the consolidated navbar -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Consolidated navbar stylesheet -->
    <link rel="stylesheet" href="/components/navbar.css?v=12">


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #0f172a;
        }

        /*
            Page-specific content begins here.

            Navbar styles were removed because they are now
            contained in navbar.css.
        */

        .hero {
            background: white;
            text-align: center;
            padding: 70px 20px 30px;
        }

        .hero h1 {
            font-size: 64px;
            margin: 0 0 20px;
            color: #082b4f;
        }

        .hero p {
            font-size: 24px;
            line-height: 1.5;
            max-width: 850px;
            margin: 0 auto 25px;
        }

        .tagline {
            font-size: 22px;
            font-weight: bold;
            color: #082b4f;
            margin-top: 25px;
        }

        .sports-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-top: 0;
        }

        .sport {
            position: relative;
            height: 280px;
            overflow: hidden;
            background: #000;
        }

        .sport img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .sport::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.65),
                rgba(0, 0, 0, 0.05)
            );
        }

        .sport h2 {
            position: absolute;
            bottom: 18px;
            left: 0;
            right: 0;
            z-index: 1;

            margin: 0;

            color: white;
            text-align: center;
            font-size: 26px;
            letter-spacing: 1px;
        }

        footer {
            background: #082b4f;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 16px;
        }

        @media (max-width: 900px) {
            .hero h1 {
                font-size: 42px;
            }

            .hero p {
                font-size: 18px;
            }

            .sports-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .sports-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!--
        Consolidated navbar is loaded into this container
        by navbar.js.
    -->
    <div id="navbar-container"></div>

    <main>
        <section class="hero">
            <h1>Welcome to Ref Ledger</h1>

            <p>
                Your all-in-one platform for managing officials, games,
                assignments, and finances — all in one place.
            </p>

            <div class="tagline">
                Built for Officials. Powered by Experience.
            </div>
        </section>

        <section class="sports-grid">
            <div class="sport">
                <img
                    src="/images/softball-ref.jpg?v=2"
                    alt="Softball referee"
                >

                <h2>SOFTBALL</h2>
            </div>

            <div class="sport">
                <img
                    src="/images/basketball-ref2.jpg?v=4"
                    alt="Basketball official"
                >

                <h2>BASKETBALL</h2>
            </div>

            <div class="sport">
                <img
                    src="/images/football-ref.jpg?v=2"
                    alt="Football official"
                >

                <h2>FOOTBALL</h2>
            </div>

            <div class="sport">
                <img
                    src="/images/baseball-ref2.jpg?v=4"
                    alt="Baseball official"
                >

                <h2>BASEBALL</h2>
            </div>
        </section>
    </main>

    <footer>
        Ref Ledger V2.0 © 2026
    </footer>

    <!-- Consolidated navbar loader and behavior -->
    <script src="/components/navbar.js?v=12"></script>

</body>

</html>
