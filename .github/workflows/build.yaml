name: Build and Push ref-ledger

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          MAJOR=1
          echo "IMAGE_TAG=v${MAJOR}.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            gablue316/ref-ledger:latest
            gablue316/ref-ledger:${{ env.IMAGE_TAG }}

      - name: Update Helm image tag
        run: |
          sed -i "0,/tag:/s/tag:.*/tag: ${{ env.IMAGE_TAG }}/" charts/ref-ledger/values.yaml

      - name: Commit Helm image tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add charts/ref-ledger/values.yaml
          git commit -m "Update image tag to ${{ env.IMAGE_TAG }}" || echo "No changes to commit"
          git push