<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="/src/style.css"><title>Ref Ledger</title></head><body>
<header><div><small>REF LEDGER</small><h1>Dashboard</h1></div><div class="account-actions"><button id="reauth" class="secondary">Sign in again</button><button id="logout" hidden>Sign out</button></div></header>
<main><section id="signin"><h2>Your next assignment, at a glance.</h2><p>Sign in securely to view your games and earnings.</p><button id="login">Sign in</button></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="dashboard" hidden><div class="totals"><article><small>Assignments</small><strong id="assignments">0</strong></article><article><small>Games</small><strong id="gameCount">0</strong></article><article><small>Earnings</small><strong id="earnings">$0.00</strong></article></div>
<form id="filters"><label>Status<select name="status"><option>Pending</option><option>Completed</option><option>Paid</option><option>Cancelled</option><option value="">All statuses</option></select></label><label>Sport<input name="sport" placeholder="All sports"></label><label>Association<input name="association" placeholder="All associations"></label><label>From<input type="date" name="begindate"></label><label>Through<input type="date" name="enddate"></label><label>Tax year<input name="taxYear" type="number" min="2000" max="2100" placeholder="All years"></label><button>Apply filters</button></form><button id="refresh" class="secondary">Refresh</button><div id="games" aria-label="Game assignments"></div></section></main><script type="module" src="/src/app.js"></script></body></html>
