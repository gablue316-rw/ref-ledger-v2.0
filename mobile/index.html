<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="/src/style.css"><title>Ref Ledger</title></head><body>
<header><div><small>REF LEDGER</small><small id="app-version" class="app-version" aria-label="App version"></small><h1 id="page-title">Games</h1></div><div class="account-actions"><button id="reauth" class="secondary">Sign in again</button><button id="logout" hidden>Sign out</button></div></header>
<div id="announcement-banner" role="status" hidden><span id="announcement-text"></span><button id="announcement-more" type="button" hidden>Read more</button><button id="announcement-clear" type="button">Clear</button><span id="announcement-status" role="alert"></span></div><dialog id="announcement-dialog" aria-labelledby="announcement-title"><h2 id="announcement-title">Announcement</h2><p id="announcement-body" tabindex="0"></p><button id="announcement-close" type="button">Close</button></dialog>
<nav id="navigation" hidden aria-label="Main navigation"><button id="menu-toggle" class="secondary" aria-label="Menu" aria-expanded="false" aria-controls="menu-options"><span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span> Menu</button><div id="menu-options" hidden><button id="nav-games" aria-current="page">Games</button><button id="nav-expenses">Expenses</button><button id="nav-reports">Reports</button><button id="nav-payments">Payments</button><button id="nav-officials">Officials</button><button id="nav-associations">Associations</button><button id="nav-sites">Sites</button><button id="nav-settings">Settings</button></div></nav><main><section id="signin"><h2>Your next assignment, at a glance.</h2><p>Sign in securely to view your games and earnings.</p><button id="login">Sign in</button></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="dashboard" hidden><div class="totals"><article><small>Assignments</small><strong id="assignments">0</strong></article><article><small>Games</small><strong id="gameCount">0</strong></article><article><small>Earnings</small><strong id="earnings">$0.00</strong></article></div>
<form id="filters"><div data-filter="status"></div><div data-filter="sport"></div><div data-filter="association"></div><div data-filter="assignor"></div><div data-filter="site"></div><div data-filter="level"></div><label>From<input type="date" name="begindate"></label><label>Through<input type="date" name="enddate"></label><label>Game ID<input name="gameId" type="number" min="1"></label><label>Home<input name="home" placeholder="Any home team"></label><label>Visitor<input name="visitor" placeholder="Any visiting team"></label><label>Tax year<input name="taxYear" type="number" min="2000" max="2100" placeholder="All years"></label><button>Apply filters</button><button id="clear-game-filters" type="button" class="secondary">Clear All Filters</button></form><button id="add-game" type="button">Add game</button><button id="refresh" class="secondary">Refresh</button><div id="games" aria-label="Game assignments"></div></section><section id="expenses-page" hidden><h2>Expenses</h2><form id="expense-filters"><label>Type<select name="type" id="expense-filter-type"><option value="">All types</option></select></label><label>Association<input name="association" placeholder="All associations"></label><label>From<input name="from" type="date"></label><label>Through<input name="through" type="date"></label><label>Tax year<input name="taxYear" type="number" min="2000" max="2100"></label><label>Description contains<input name="description"></label><button>Search expenses</button><button type="reset" class="secondary">Clear filters</button></form><div class="page-actions"><button id="add-expense" type="button">Add expense</button><button id="refresh-expenses" type="button" class="secondary">Refresh</button></div><p id="expense-message" role="status" aria-live="polite"></p><div id="expense-list"></div></section>
<section id="reports-page" hidden><h2>Reports</h2><div id="reports-root"></div></section><section id="payments-page" hidden><h2>Payments</h2><div id="payments-root"></div></section><section id="officials-page" hidden><h2>Officials</h2><div id="officials-root"></div></section><section id="associations-page" hidden><h2>Associations</h2><div id="associations-root"></div></section><section id="sites-page" hidden><h2>Sites</h2><div id="sites-root"></div></section><section id="settings-page" hidden><h2>Settings</h2><div id="settings-root"></div></section></main><script type="module" src="/src/app.js"></script></body></html>
