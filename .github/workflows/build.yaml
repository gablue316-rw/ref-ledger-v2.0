name: Build and Push ref-ledger

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set image tag
        shell: bash
        run: |
          MAJOR=1

          if [[ "${GITHUB_REF_NAME}" == "development" ]]; then
            echo "IMAGE_TAG=dev-v${MAJOR}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "ROLLING_TAG=dev-latest" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=v${MAJOR}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "ROLLING_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Display build information
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Version tag: $IMAGE_TAG"
          echo "Rolling tag: $ROLLING_TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            gablue316/ref-ledger:${{ env.ROLLING_TAG }}
            gablue316/ref-ledger:${{ env.IMAGE_TAG }}

      - name: Update Helm image tag
        shell: bash
        run: |
          sed -i "0,/^[[:space:]]*tag:/s|tag:.*|tag: ${{ env.IMAGE_TAG }}|" values.yaml

          echo "Updated image configuration:"
          grep -A 3 "^image:" values.yaml

      - name: Commit Helm image tag
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update image tag to ${{ env.IMAGE_TAG }}"
            git push origin HEAD:${{ github.ref_name }}
          fi